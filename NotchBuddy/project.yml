name: NotchBuddy
options:
  bundleIdPrefix: com.karmawebs
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
  configs:
    Debug:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
    Release:
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: 256AUJ9555
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      CODE_SIGN_ENTITLEMENTS: Resources/Coucou.entitlements

targets:
  NotchBuddy:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Karma Assistant
        CFBundleDisplayName: Karma Assistant
        CFBundleIdentifier: com.karmawebs.assistant
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        NSAppleEventsUsageDescription: "Karma Assistant puede abrir herramientas y aplicaciones relacionadas con tus tareas."
        NSAccessibilityUsageDescription: "Karma Assistant puede usar el contexto de la ventana activa cuando tú lo solicites."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karmawebs.assistant
        PRODUCT_NAME: Karma Assistant
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_SANDBOX: NO

  CoucouAppStore:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
    info:
      path: Resources/InfoAppStore.plist
      properties:
        CFBundleName: Karma Assistant
        CFBundleDisplayName: Karma Assistant
        CFBundleIdentifier: com.karmawebs.assistant.appstore
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: NO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karmawebs.assistant.appstore
        PRODUCT_NAME: Karma Assistant
        INFOPLIST_FILE: Resources/InfoAppStore.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Resources/CoucouAppStore.entitlements
        DEVELOPMENT_TEAM: 256AUJ9555
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
